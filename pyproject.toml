[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mflux-gallery"
version = "0.2.0"
description = "A FastHTML-based image gallery for viewing generated images"
requires-python = ">=3.11,<3.16"
dependencies = [
    "pillow-heif>=1.6,<2.0",
    "pillow>=12.3,<13",
    "python-fasthtml>=0.14.13,<1.0",
    "rich>=14.0,<15.0",
    "starlette>=1.6,<2.0",
]

[project.scripts]
mflux-gallery = "mflux_gallery.main:main"

[tool.ruff.lint]
select = ["BLE", "C90", "E4", "E7", "E9", "F", "I", "ICN", "LOG", "PERF", "W"]
ignore = [
    "F811", # ignore reused get/post definitions
]

[tool.ruff.lint.mccabe]
max-complexity = 10
